<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나비 모션 고르기</title>
<style>
body{margin:0;background:#efeff0;font-family:-apple-system,system-ui,sans-serif;color:#1d2730;padding:24px 16px}
h1{font-size:16px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:820px}
.c{background:#fff;border-radius:12px;padding:18px 12px 12px;text-align:center}
.s{height:90px;display:grid;place-items:center}
.f{width:38px;aspect-ratio:38/51;background:url(https://raw.githubusercontent.com/rain00day-collab/doeunha/claude/stoic-euler-v1wox8/assets/upgrade-butterfly.png) 0 0/100% 100% no-repeat}
b{display:block;font-size:14px;margin-top:6px}small{color:#75818c;font-size:12px}
.m1{animation:flap 1.6s ease-in-out infinite}@keyframes flap{0%,60%,100%{transform:scaleX(1)}70%{transform:scaleX(.25)}80%{transform:scaleX(1)}88%{transform:scaleX(.4)}}
.m2{animation:float 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.m3{transform-origin:50% 90%;animation:sway 2.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.m4{animation:fly 2.4s ease-in-out infinite}@keyframes fly{0%,100%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-6px) scaleX(.45)}50%{transform:translateY(-9px) scaleX(1)}75%{transform:translateY(-4px) scaleX(.55)}}
.m5{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.m6{animation:pop 3s ease-in-out infinite}@keyframes pop{0%,70%,100%{transform:translate(0,0) rotate(0)}76%{transform:translate(2px,-7px) rotate(10deg)}84%{transform:translate(-1px,-3px) rotate(-6deg)}92%{transform:translate(0,0) rotate(0)}}
</style></head><body>
<h1>나비 모션 고르기 — 번호로 알려주세요</h1>
<div class="grid">
<div class="c"><div class="s"><div class="f m1"></div></div><b>1. 날갯짓</b><small>가끔 날개를 접었다 폄</small></div>
<div class="c"><div class="s"><div class="f m2"></div></div><b>2. 둥실</b><small>위아래로 천천히 떠다님</small></div>
<div class="c"><div class="s"><div class="f m3"></div></div><b>3. 살랑</b><small>좌우로 살짝 흔들림</small></div>
<div class="c"><div class="s"><div class="f m4"></div></div><b>4. 날갯짓 + 둥실</b><small>떠오르며 날개 파닥</small></div>
<div class="c"><div class="s"><div class="f m5"></div></div><b>5. 숨쉬기</b><small>살짝 커졌다 작아짐</small></div>
<div class="c"><div class="s"><div class="f m6"></div></div><b>6. 톡 튀기</b><small>가만있다 가끔 톡 움직임</small></div>
</div></body></html>
