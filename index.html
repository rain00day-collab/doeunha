<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique · Reserved.Sanctuary</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root {
  --bg: #efeff0;
  --accent: #3a9af3;
  --text: #000;
  --text-mute: #9d9d9d;
  --font: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
body { min-height: 100dvh; position: relative; overflow-x: hidden; }
body.modal-open { overflow: hidden; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }

/* ─── 상단 ─── */
.top-left {
  position: absolute;
  top: 2.6%; left: 3.5%;
  font-size: clamp(8px, 0.6vw, 9.5px);
  line-height: 1.3; z-index: 2;
}
.top-left sup {
  font-size: 0.82em;
  margin-right: 8px;
  vertical-align: top;
}
.top-center {
  position: absolute;
  top: 2.6%; left: 50%;
  transform: translateX(-50%);
  font-size: clamp(8px, 0.6vw, 9.5px);
  line-height: 1.4;
  text-align: left;
  white-space: pre-line;
  z-index: 2;
}
.top-right {
  position: absolute;
  top: 2.6%; right: 3.5%;
  font-size: clamp(8px, 0.6vw, 9.5px);
  z-index: 2;
}

/* ─── 중앙 Savior 아이콘 ─── */
.savior-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  user-select: none;
  cursor: pointer;
  z-index: 3;
  transition: transform 0.15s ease;
}
.savior-icon:hover { transform: translate(-50%, -50%) scale(1.04); }
.savior-icon:active { transform: translate(-50%, -50%) scale(0.97); }
.savior-icon img {
  width: clamp(50px, 5vw, 72px);
  height: auto;
  display: block;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,0.08));
}

/* ─── 하단 아이콘 ─── */
.corner-btn {
  position: absolute;
  bottom: 4%;
  color: var(--accent);
  z-index: 4;
  padding: 6px;
  transition: transform 0.15s ease;
}
.corner-btn.left { left: 3.5%; }
.corner-btn.right { right: 3.5%; }
.corner-btn svg {
  width: clamp(20px, 1.8vw, 26px);
  height: auto; display: block;
  stroke: currentColor; fill: none; stroke-width: 1.6;
}
.corner-btn:hover { transform: scale(1.06); }
.corner-btn:active { transform: scale(0.92); }
#heart-btn.on svg { fill: var(--accent); }

/* ─── Modal (Boutique 카드) ─── */
.modal {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0);
  display: flex;
  align-items: center; justify-content: center;
  padding: 24px;
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
}
.modal.open { opacity: 1; visibility: visible; }
.modal-wrap {
  position: relative;
  width: 100%;
  max-width: clamp(260px, 32vw, 440px);
  transform: scale(0.86) translateY(16px);
  opacity: 0;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.3s ease;
  transform-origin: center 55%;
}
.modal.open .modal-wrap { transform: scale(1) translateY(0); opacity: 1; }
.modal-img {
  width: 100%; height: auto; display: block;
  filter: drop-shadow(0 20px 50px rgba(0,0,0,0.12));
}

/* 투명 클릭 영역 — 실측치 반영 */
.hit-btn {
  position: absolute;
  background: transparent;
  cursor: pointer;
  border: none;
  padding: 0;
  border-radius: 6px;
  transition: background 0.15s ease;
}
.hit-btn:hover { background: rgba(0,0,0,0.06); }
.hit-btn:active { background: rgba(0,0,0,0.12); }
/* 아이콘 실측 y: 14.26-18.16%, x: 58.47-66.42% */
.hit-minus { top: 14.3%; left: 58.4%; width: 4%; height: 4%; }
.hit-square { top: 14.3%; left: 62.4%; width: 4%; height: 4%; }

/* ─── 메뉴 패널 (□ 누르면 열림) ─── */
.menu-panel {
  position: absolute;
  top: 22%;
  left: 95%;
  width: clamp(130px, 20vw, 200px);
  background: #FFFFFF;
  border-radius: 10px;
  padding: 10px 0;
  box-shadow: 0 18px 44px rgba(0,0,0,0.15),
              0 4px 12px rgba(0,0,0,0.08);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top left;
  transition: opacity 0.22s ease,
              transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0.22s;
  z-index: 15;
}
.menu-panel.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0) scale(1);
}
.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 20px;
  font-family: inherit;
  font-size: clamp(11px, 0.95vw, 14px);
  font-weight: 400;
  color: #0A0A0A;
  background: transparent;
  cursor: pointer;
  border: none;
  letter-spacing: -0.005em;
  transition: background 0.15s ease;
}
.menu-item.active { background: #D8E0F2; }
.menu-item:hover:not(.active) { background: #F3F4F7; }

/* 카드 교체: img src 변경 */
.modal-img { transition: opacity 0.2s ease; }

/* 모바일 */
@media (max-width: 600px) {
  .top-left, .top-center, .top-right { font-size: 9px; }
  .savior-icon img { width: 46px; }
  .corner-btn svg { width: 20px; }
  .top-center { max-width: 60%; }
  .modal-wrap { max-width: 86%; }
}
@media (max-width: 420px) {
  .top-left, .top-center, .top-right { font-size: 8px; }
  .top-center { max-width: 54%; }
}
</style>
</head>
<body>

<div class="top-left"><sup>1</sup>Boutique</div>

<div class="top-center">a small retail shop or business
that sells fashionable clothes,
shoes, jewelry, gifts, or specialized
luxury item</div>

<div class="top-right">Reserved.Sanctuary.com</div>

<div class="savior-icon" id="savior-icon" role="button" tabindex="0" aria-label="Boutique 열기">
  <img id="img-savior" alt="Savior">
</div>

<button class="corner-btn left" id="heart-btn" aria-label="좋아요">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </svg>
</button>

<button class="corner-btn right" id="share-btn" aria-label="공유">
  <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3"/>
    <circle cx="6" cy="12" r="3"/>
    <circle cx="18" cy="19" r="3"/>
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
  </svg>
</button>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-wrap">
    <img class="modal-img" id="img-card" alt="Boutique">
    <button class="hit-btn hit-minus" id="btn-minus" aria-label="닫기"></button>
    <button class="hit-btn hit-square" id="btn-square" aria-label="메뉴"></button>
    <div class="menu-panel" id="menu-panel" role="menu">
      <button class="menu-item active" data-item="pick" role="menuitem">[Designer's PICK]</button>
      <button class="menu-item" data-item="about" role="menuitem">About</button>
      <button class="menu-item" data-item="list" role="menuitem">List</button>
      <button class="menu-item" data-item="prompt" role="menuitem">Prompt</button>
      <button class="menu-item" data-item="luvlog-wind" role="menuitem">Luvlog.wind</button>
      <button class="menu-item" data-item="luvlog-savior" role="menuitem">Luvlog.savior</button>
      <button class="menu-item" data-item="luvinfo" role="menuitem">Luvinfo.ing...</button>
      <button class="menu-item" data-item="banner" role="menuitem">Banner</button>
    </div>
  </div>
</div>

function openModal() { modal.classList.add('open'); document.body.classList.add('modal-open'); }
function closeModal() {
  modal.classList.remove('open');
  document.body.classList.remove('modal-open');
  menuPanel.classList.remove('open');
}

savior.addEventListener('click', openModal);
savior.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
});

btnMinus.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });

// □ 버튼: 메뉴 토글
btnSquare.addEventListener('click', (e) => {
  e.stopPropagation();
  menuPanel.classList.toggle('open');
});

// 메뉴 항목 클릭 → 하이라이트 + 카드 content 교체
function selectItem(name) {
  menuItems.forEach(x => x.classList.toggle('active', x.dataset.item === name));
  imgCard.src = (name === 'pick') ? IMG_CARD : IMG_CARD_EMPTY;
}
menuItems.forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    selectItem(item.dataset.item);
  });
});

// 메뉴 외부 클릭시 메뉴만 접기 (모달은 유지)
document.addEventListener('click', (e) => {
  if (!menuPanel.contains(e.target) && e.target !== btnSquare) {
    menuPanel.classList.remove('open');
  }
});

modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

const heartBtn = document.getElementById('heart-btn');
heartBtn.addEventListener('click', () => heartBtn.classList.toggle('on'));

// 공유 버튼 — 기능 추후
</script>
